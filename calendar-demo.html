<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Календар на огледите · Имоти Панагюрище</title><style>:root{font-family:Arial,sans-serif;color:#10263c;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}header{background:#10263c;color:white;padding:20px}header a{color:#e2c083}main{max-width:1100px;margin:24px auto;padding:16px}.card{background:white;border:1px solid #dfe6ec;border-radius:12px;padding:20px;margin:14px 0}.notice{background:#fff2d9;padding:12px;border-radius:8px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.controls button{background:#10263c;color:#fff;border:0;border-radius:6px;padding:10px 15px;cursor:pointer}.controls select{padding:10px}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.day{border:1px solid #d9e1e9;border-radius:8px;min-height:95px;padding:8px;background:#fff}.day.muted{opacity:.35}.day.today{border:2px solid #c7a366}.day strong{display:block;margin-bottom:7px}.event{display:block;background:#e9f0f6;border:0;border-left:3px solid #b89458;border-radius:4px;padding:6px;margin:4px 0;text-align:left;width:100%;font-size:12px;color:#10263c;cursor:pointer;overflow-wrap:anywhere}.event:hover{background:#d9e8f5}.row{border-bottom:1px solid #e3e8ed;padding:12px 0}.row button{margin-left:8px}a{color:#916b2e}@media(max-width:700px){.week{gap:3px}.day{padding:4px;min-height:64px;font-size:12px}.event{font-size:10px;padding:3px}.card{padding:12px}}</style></head><body><header><strong>ИМОТИ ПАНАГЮРИЩЕ</strong><p><a href="dashboard-demo.html">← Административен панел</a> · <a href="client-dossier-demo.html">Клиентски досиета</a></p></header><main><h1>📅 Общ календар на огледите</h1><p class="notice">Демонстрация. Огледите се зареждат от този браузър; няма синхронизация между устройства. Не въвеждайте истински лични данни.</p><section class="card"><div class="controls"><button id="prev" aria-label="Предишен месец">←</button><h2 id="month"></h2><button id="next" aria-label="Следващ месец">→</button><button id="now">Текущ месец</button><label>Статус <select id="status"><option value="all">Всички</option><option value="upcoming">Предстоящи</option><option value="past">Минали</option></select></label></div><div id="calendar" class="week"></div></section><section class="card"><h2>Огледи за избрания месец</h2><div id="agenda"></div></section></main><script>
const key='imoti_demo_property_activity';let shown=new Date();shown.setDate(1);shown.setHours(0,0,0,0);
const fmt=new Intl.DateTimeFormat('bg-BG',{month:'long',year:'numeric'}),dateFmt=new Intl.DateTimeFormat('bg-BG',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
function load(){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}}
function events(){const all=[];for(const [property,record] of Object.entries(load())){const bits=property.split('|');for(const v of record.viewings||[]){const d=new Date(v.date);if(Number.isNaN(d.getTime()))continue;all.push({date:d,property:bits[1]||'Имот',owner:bits[0]||'',visitor:v.visitor||'Клиент',status:d>=new Date()?'upcoming':'past'})}}return all.sort((a,b)=>a.date-b.date)}
function selected(e){return document.getElementById('status').value==='all'||document.getElementById('status').value===e.status}
function render(){const y=shown.getFullYear(),m=shown.getMonth(),list=events().filter(e=>e.date.getFullYear()===y&&e.date.getMonth()===m&&selected(e));document.getElementById('month').textContent=fmt.format(shown);const root=document.getElementById('calendar');root.replaceChildren();for(const d of ['Пн','Вт','Ср','Чт','Пт','Сб','Нд']){const x=document.createElement('strong');x.textContent=d;root.append(x)}const offset=(new Date(y,m,1).getDay()+6)%7;const days=new Date(y,m+1,0).getDate();for(let i=0;i<Math.ceil((offset+days)/7)*7;i++){const day=i-offset+1;const cell=document.createElement('div');cell.className='day'+(day<1||day>days?' muted':'');if(day>=1&&day<=days){const label=document.createElement('strong');label.textContent=day;cell.append(label);if(new Date().toDateString()===new Date(y,m,day).toDateString())cell.className+=' today';for(const e of list.filter(x=>x.date.getDate()===day)){const b=document.createElement('button');b.className='event';b.textContent=e.date.toLocaleTimeString('bg-BG',{hour:'2-digit',minute:'2-digit'})+' '+e.property;b.title=e.visitor+' · '+e.property;b.onclick=()=>document.getElementById('agenda').scrollIntoView({behavior:'smooth'});cell.append(b)}}root.append(cell)}const agenda=document.getElementById('agenda');agenda.replaceChildren();if(!list.length){const p=document.createElement('p');p.textContent='Няма огледи за избрания месец и филтър.';agenda.append(p)}for(const e of list){const row=document.createElement('div');row.className='row';row.textContent=dateFmt.format(e.date)+' · '+e.property+' · '+e.visitor+' · '+(e.status==='upcoming'?'Предстоящ':'Минал');agenda.append(row)}}
document.getElementById('prev').onclick=()=>{shown.setMonth(shown.getMonth()-1);render()};document.getElementById('next').onclick=()=>{shown.setMonth(shown.getMonth()+1);render()};document.getElementById('now').onclick=()=>{shown=new Date();shown.setDate(1);render()};document.getElementById('status').onchange=render;render();
</script></body></html>
