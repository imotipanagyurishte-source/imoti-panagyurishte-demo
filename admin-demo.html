<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Демо преглед на обяви</title><link rel="stylesheet" href="styles.css"><style>main{max-width:950px;margin:60px auto;padding:20px}.item{border:1px solid #ddd;padding:20px;margin:16px 0}.item button{padding:12px;margin:5px;border:0;background:#10263c;color:#fff}.notice{background:#fff3db;padding:18px;line-height:1.6}</style></head><body><header class="top"><a class="brand" href="index.html"><strong>ИМОТИ ПАНАГЮРИЩЕ</strong></a><a href="publish.html">Публикувай</a></header><main><h1>Преглед на обяви — демонстрация</h1><p class="notice">Това НЕ е защитен административен панел. Виждат се само черновите, създадени в същия браузър. Бутоните не публикуват обяви онлайн. Не въвеждайте реални лични данни при тестове.</p><div id="list"></div></main><script>const key="imoti_demo_submissions";function read(){try{return JSON.parse(localStorage.getItem(key)||"[]")}catch{return []}}function render(){const list=document.getElementById("list");list.replaceChildren();const rows=read();if(!rows.length){list.textContent="Няма локални чернови.";return}rows.forEach((row,i)=>{const el=document.createElement("div");el.className="item";const h=document.createElement("h2");h.textContent=row.title||"Без заглавие";const p=document.createElement("p");p.textContent=[row.city,row.kind,row.price+" €","Статус: "+row.status].join(" · ");const desc=document.createElement("p");desc.textContent=row.description||"";el.append(h,p,desc);for(const [status,label] of [["demo-approved","Одобри (демо)"],["demo-rejected","Отхвърли (демо)"]]){const b=document.createElement("button");b.textContent=label;b.addEventListener("click",()=>{const all=read();all[i].status=status;localStorage.setItem(key,JSON.stringify(all));render()});el.append(b)}list.append(el)})}render();</script></body></html>
